name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        # Qt 6.8 supports building through macOS 15. macos-latest currently
        # resolves to macOS 26, whose SDK no longer contains AGL.framework,
        # but Qt 6.8's CMake metadata still links it.
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQT_UI_STYLE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Configure package consumer
        run: cmake -S tests/package-consumer -B consumer-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install

      - name: Build package consumer
        run: cmake --build consumer-build --config Release
